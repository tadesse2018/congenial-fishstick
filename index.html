<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DIA Grade Pro - Official Roster</title>

<!-- PWA Settings -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22DIAGradePro%22,%22short_name%22:%22GradePro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#1e40af%22,%22theme_color%22:%22#1e40af%22}">

<style>
:root{--p:#1e40af;--s:#15803d;--d:#b91c1c;--bg:#f1f5f9;--w:#f59e0b;--card-blue:#1e3a8a;--tg:#0088cc}
*{box-sizing:border-box;font-family: 'Nyala', 'Abyssinica SIL', 'Segoe UI', sans-serif}
body{margin:0;background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.roster-print-header { display: none; text-align: center; border-bottom: 2px double #000; margin-bottom: 15px; padding: 10px; background: #fff; }

/* ==========================================================================
   * ሮስተር እና ካርድ ላይ ያሉትን ሁሉንም ጽሑፎች ደማቅ (Bold) ማድረጊያ *
   ========================================================================== */
body, input, select, table, td, th, 
.card-content, .card-content *, 
#rosterHeader, #rosterHeader *,
#rosterFooterContainer, #rosterFooterContainer * {
    font-weight: bold !important;
}

/* 1. በሲስተሙ ስክሪን ላይ (App View) - የሮስተር ሄደር የውስጥ መስመሮችን ነጭ ማድረግ */
.roster-table-header-row, 
#mainTable tbody[style*="background-color: #eee"], 
#mainTable tbody:first-child {
    background-color: #000000 !important;
}

.roster-table-header-row th, 
#mainTable tbody:first-child th {
    background-color: #000000 !important;
    color: #ffffff !important;
    font-weight: 900 !important;
    border: 2px solid #ffffff !important; 
    padding: 8px 4px !important;
}

/* 2. የህትመት ማስተካከያ (Print View) */
@media print {
    @page { 
        size: A4 portrait; 
        margin: 0mm !important; 
    }

    .btn-modal-hide, .app-header, .top, .bar, .stats-bar, .btn, #login, .no-print, .sync-badge { 
        display: none !important; 
    }

    body, html { 
        background: white !important; 
        overflow: visible !important; 
        height: auto !important; 
        width: 100% !important; 
        display: block !important; 
        color: #000 !important; 
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    #app { display: block !important; }
    main { 
        overflow: visible !important; 
        display: block !important; 
        padding: 0 !important; 
        width: 100% !important; 
        margin: 0 !important; 
    }

    body.printing-roster {
        padding: 10mm 5mm !important; 
    }

    body.printing-roster .roster-print-header { 
        display: block !important; 
    }
    
    body.printing-roster #mainTable { 
        width: 100% !important; 
        border: 2px solid #000 !important; 
        display: table !important; 
        border-collapse: collapse !important;
        margin-bottom: 25px; 
    }

    body.printing-roster .roster-table-header-row th {
        background-color: #000000 !important; 
        color: #ffffff !important; 
        font-weight: 900 !important; 
        border: 2px solid #ffffff !important; 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important;
        padding: 6px 4px !important;
    }

    body.printing-roster td, 
    body.printing-roster th,
    body.printing-roster span,
    body.printing-roster h1,
    body.printing-roster h2 {
        border: 2px solid #000 !important; 
        font-weight: bold !important; 
        color: #000 !important; 
    }

    body.printing-roster tbody { 
        page-break-inside: avoid !important; 
        break-inside: avoid !important;
    }

    .roster-footer-row {
        display: flex !important;
        justify-content: space-between !important;
        align-items: flex-end !important; 
        width: 100% !important; 
        margin-top: 25px !important;
        page-break-inside: avoid !important; 
    }

    .roster-stats-container { width: 45% !important; }
    .roster-stats-container th {
        background-color: #000000 !important;
        color: #ffffff !important;
        border: 2px solid #ffffff !important; 
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .roster-stats-container table, .roster-stats-container td {
        border: 2px solid #000 !important;
        font-weight: bold !important;
        color: #000 !important; 
    }

    .roster-signatures-container {
        width: 45% !important;
        display: flex !important;
        justify-content: space-between !important;
    }
    .roster-sig-box {
        text-align: center !important;
        width: 45% !important;
        border-top: 2px solid #000 !important; 
        padding-top: 8px !important;
        font-weight: 900 !important;
        font-size: 11px !important;
        color: #000 !important; 
    }

    body.printing-cards #tableContainer { 
        display: none !important; 
    }

    body.printing-cards #modal { 
        display: block !important; 
        position: relative !important; 
        background: white !important; 
        padding: 4mm 4mm 0mm 4mm !important; 
        margin: 0 !important;
        width: 100% !important; 
        box-sizing: border-box !important;
    }

    body.printing-cards .card-content { 
        width: 100% !important; 
        height: auto !important; 
        min-height: 135mm !important; 
        margin: 0 auto 4mm auto !important; 
        padding: 3mm !important; 
        page-break-inside: avoid !important; 
        break-inside: avoid !important;
        display: flex !important;
        flex-direction: column !important;
        box-sizing: border-box !important;
        color: #000 !important;
    }

    body.printing-cards .card-content:nth-child(even) {
        page-break-after: always !important;
        break-after: page !important;
        margin-bottom: 0 !important;
    }

    .card-table th, .card-table td { 
        border: 1px solid #000 !important; 
        padding: 2px !important; 
        font-size: 10px !important; 
        color: #000 !important;
        font-weight: bold !important;
    }
}

.app-header { background: #111827; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--w); }
#login{position:fixed;inset:0;background:linear-gradient(45deg, #1e3a8a 0%, #3b82f6 100%);display:flex;align-items:center;justify-content:center;z-index:10000}
.login-box{background:rgba(255,255,255,0.15);padding:30px;border-radius:20px;border:2px solid rgba(255,255,255,0.5);backdrop-filter:blur(15px);text-align:center;color:#fff;width:360px; max-height: 95vh; overflow-y: auto;}
#login input{padding:10px;border-radius:8px;border:none;margin:8px 0;width:100%;text-align:center;font-size:16px;background:#fff;color:#1e3a8a;font-weight:700}
#login select{padding:8px; border-radius:5px; color:black; width:100%; margin:5px 0; font-weight:700;}
.login-btn{padding:10px 0;width:100%;border-radius:30px;border:none;background:#fff;color:#1e3a8a;font-weight:700;cursor:pointer}

#app{display:none;flex-direction:column;height:100%}
.top { background: #fff; padding: 8px; border-bottom: 3px solid var(--p); display: block; }
.top.collapsed { display: none !important; }
.row { display: flex; gap: 5px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px }
.fld { display: flex; flex-direction: column }
label { font-size: 10px; font-weight: 700; color: #475569 }
input, select { padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; outline: 0; color: #000 }
.bar { background: #e2e8f0; padding: 10px; display: flex; gap: 8px; align-items: center; overflow-x: auto; border-bottom: 2px solid #cbd5e1 }
.btn { padding: 8px 14px; border: 0; border-radius: 4px; color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px }

main { flex: 1; overflow: auto; padding: 8px; background: #fff }
table { border-collapse: collapse; background: #fff; width: 100%; font-size: 11px }
th, td { border: 1px solid #475569; padding: 6px 10px; text-align: center; color: #000 }
th { background: #1e293b; color: #fff; position: sticky; top: 0; z-index: 10; }

.stats-bar { display: flex; gap: 20px; padding: 10px; background: #f8fafc; border-top: 1.5px solid #cbd5e1; font-weight: bold; font-size: 13px; }
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; overflow-y: auto; padding: 20px }
.card-content { background: #fff; width: 165mm; margin: 0 auto 20px auto; padding: 5mm; border-radius: 4px; color: #000; }
.main-card-border { border: 2px solid var(--card-blue); padding: 5px; height: 100%; }
.card-header-box { text-align: center; border-bottom: 2px solid var(--card-blue); padding-bottom: 5px; margin-bottom: 8px; }
.card-title-main { font-size: 18px; font-weight: 900; color: var(--card-blue); margin: 0; }
.year-badge { display: inline-block; background: var(--card-blue); color: white; padding: 2px 15px; border-radius: 12px; font-size: 12px; margin-top: 4px; }

.info-grid { display: grid; grid-template-columns: 1.2fr 0.6fr 0.8fr 0.4fr; border: 1.5px solid var(--card-blue); margin-bottom: 8px; font-size: 12px; background: #f8fafc; }
.info-grid div { padding: 4px; border-right: 1.5px solid var(--card-blue); }
.info-grid div:last-child { border-right: none; }

.card-table { width: 100%; border-collapse: collapse; border: 1.5px solid var(--card-blue); }
.card-table th { border: 1px solid var(--card-blue); padding: 3px; background: #f1f5f9; color: var(--card-blue); font-size: 10px; line-height: 1.2; }
.card-table td { border: 1px solid #ccc; padding: 3px; text-align: center; font-weight: bold; font-size: 11px; }
.highlight-cell { background: #f1f5f9; color: var(--card-blue); }

.signature-area { margin-top: 20px; display: flex; justify-content: space-between; width: 100%; padding: 0 5px; }
.sig-line { width: 30%; border-top: 1.5px solid #000; text-align: center; padding-top: 3px; font-weight: 900; font-size: 10px; }

.sync-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 10px; }
.sync-on { background: #dcfce7; color: #166534; }
.sync-off { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>

<div id="login">
    <div class="login-box">
        <h2>DIA ROSTER APP (ሮስተር)</h2>
        <input type="tel" id="phoneInput" placeholder="የስልክ ቁጥር (Phone Number)">
        <input type="password" id="passInput" placeholder="የግል ማለፊያ ቃል (Personal Password)">
        
        <div style="border-top: 1px solid rgba(255,255,255,0.3); margin-top: 15px; padding-top: 10px;">
            <p style="margin: 0 0 10px 0; color: #f59e0b; font-size: 13px;">አዲስ ለመመዝገብ ብቻ የሚሞላ (For Signup Only)፦</p>
            
            <input type="password" id="classCodeInput" placeholder="የክፍሉ መለያ ኮድ (Class Code)">
            
            <div style="text-align: left; color: white; font-size: 13px;">
                <label>የሚያስተምሩት ክፍል (Grade)፦</label>
                <select id="signUpGrade">
                    <option value="Grade_1">Grade 1</option>
                    <option value="Grade_2">Grade 2</option>
                    <option value="Grade_3">Grade 3</option>
                    <option value="Grade_4">Grade 4</option>
                    <option value="Grade_5">Grade 5</option>
                    <option value="Grade_6">Grade 6</option>
                    <option value="Grade_7">Grade 7</option>
                    <option value="Grade_8">Grade 8</option>
                    <option value="Grade_9">Grade 9</option>
                    <option value="Grade_10">Grade 10</option>
                    <option value="Grade_11">Grade 11</option>
                    <option value="Grade_12">Grade 12</option>
                </select>
            </div>

            <div style="text-align: left; color: white; font-size: 13px; margin-top: 8px;">
                <label>ሴክሽን (Section)፦</label>
                <select id="signUpSection">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="login-btn" onclick="checkLogin()" style="flex: 1;">LOGIN / ግባ</button>
            <button class="login-btn" onclick="handleSignUp()" style="flex: 1; background-color: #28a745;">SIGN UP / ምዝገባ</button>
        </div>
    </div>
</div>

<div id="app">
    <div class="app-header">
        <div style="display:flex; align-items:center">
            <div style="font-weight:900">DIA GRADE PRO / ዲአይኤ ግሬድ</div>
            <span id="cloudStatus" class="sync-badge sync-off">Cloud: Local Mode</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center">
            <span>Dev: Taddesse M.</span>
            <button class="btn" style="background:var(--w); color:#000" onclick="toggleForm()">↕ እጠፍ/ዘርጋ (Fold)</button>
        </div>
    </div>
    
    <div class="top" id="inputForm">
        <div class="row">
            <div class="fld"><label>School Name / ትምህርት ቤት</label><input type="text" id="h_s" value="DILIGENT INTELLECTUALS ACADEMY" style="width:250px" onblur="syncSettingsWithCloud()" onchange="syncSettingsWithCloud()"></div>
            <div class="fld"><label>Mode / ዓይነት</label><select id="h_m" onchange="handleModeChange(); syncSettingsWithCloud()"><option value="semester">Semester / ሴሚስተር</option><option value="quarter" selected>Quarter / ኳርተር</option></select></div>
            <div class="fld"><label>Year / ዓመተ ምሕረት</label><input type="text" id="h_y" value="2018 E.C" style="width:120px" onblur="syncSettingsWithCloud()" onchange="syncSettingsWithCloud()"></div>
            <div class="fld"><label>Subjects / ትምህርቶች (በኮማ ይለዩ)</label><input type="text" id="h_b" value="Math, English, Amharic, Science, IT" style="width:230px" oninput="saveSubs()" onblur="syncSettingsWithCloud()"></div>
            <button class="btn" style="background:var(--d)" onclick="handleLogout()">LOGOUT 🔒 መውጫ</button>
        </div>
        <div class="row" style="border-top:1px solid #eee;padding-top:10px">
            <input type="hidden" id="e_id" value="-1">
            <div class="fld"><label>No. / ተ.ቁ</label><input type="number" id="e_n" style="width:50px"></div>
            <div class="fld"><label>Name / ስም</label><input type="text" id="e_m" style="width:160px"></div>
            <div class="fld"><label>Sex / ጾታ</label><select id="e_x"><option>M</option><option>F</option></select></div>
            <div class="fld"><label>Age / እድሜ</label><input type="number" id="e_a" style="width:40px"></div>
            <div class="fld"><label>Term / ክፍለ ጊዜ</label><select id="e_t"></select></div>
            <div class="fld"><label>Conduct / ጠባይ</label><select id="e_c"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
            <div class="fld"><label>Absent / የቀረ</label><input type="number" id="e_abs" value="0" style="width:45px"></div>
            <div class="fld"><label>Note / አስተያየት (ባዶ ቢተው በራሱ ይሞላል)</label><input type="text" id="e_com" style="width:180px" placeholder="Auto-generated if empty"></div>
            <div id="subjectInputs" style="display:flex;gap:4px"></div>
            <button class="btn" style="background:var(--s)" id="saveBtn" onclick="saveData()">💾 SAVE / መዝግብ</button>
        </div>
        <div class="row" style="background:#fffbeb; padding:5px; border-radius:5px">
            <div class="fld"><label>GRADE / ክፍል</label><input type="text" id="view_g" value="Grade 4" style="width:70px" oninput="updateViewState()"></div>
            <div class="fld"><label>SEC / ምድብ</label><input type="text" id="view_s" value="A" style="width:40px" oninput="updateViewState()"></div>
        </div>
    </div>

    <div class="bar">
        <button class="btn" style="background:#475569" onclick="exportJSON()">📥 BACKUP / ኮፒ</button>
        <button class="btn" style="background:#0891b2" onclick="document.getElementById('importFile').click()">📤 RESTORE / መልስ</button>
        <button class="btn" style="background:#7c3aed" onclick="handlePrintCards()">🗂️ PRINT CARDS / ካርድ አትም</button>
        <button class="btn" style="background:var(--p)" onclick="handlePrintRoster()">📋 PRINT ROSTER / ሮስተር</button>
        <button class="btn" style="background:var(--s)" onclick="addSubject()">➕ ADD SUB / ትምህርት ጨምር</button>
        <button class="btn" style="background:var(--d)" onclick="clearAllData()">⚠️ CLEAR / አጥፋ</button>
        <button class="btn" style="background:var(--tg)" onclick="syncWithCloud()">☁️ PUSH CLOUD / ደመና ጫን</button>
        <button class="btn" style="background:#ea580c" onclick="pullFromCloud()">📥 PULL CLOUD / አውርድ</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
        <input type="text" id="searchQ" placeholder="🔍 ስም ፈልግ (Search)..." onkeyup="renderTable()" style="width:180px; flex-shrink:0">
    </div>

    <main id="tableContainer">
        <div id="rosterHeader" class="roster-print-header"></div>
        <table id="mainTable"></table>
    </main>
    <div class="stats-bar" id="statsBar">
        <span id="statM">M / ወ: 0</span> | <span id="statF">F / ሴ: 0</span> | <span id="statT">Total / ድምር: 0</span>
    </div>
</div>

<div id="modal">
    <div style="text-align:center; margin-bottom:15px" class="btn-modal-hide">
        <button class="btn" style="background:var(--d)" onclick="closeModal()">CLOSE / ዝጋ</button>
        <button class="btn" style="background:var(--s)" onclick="window.print()">PRINT / አትም</button>
    </div>
    <div id="cardView"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIQLl6EGGscg35mSpFvhhGYSU84IANNxQ",
        authDomain: "dia-ros.firebaseapp.com",
        databaseURL: "https://dia-ros-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "dia-ros",
        storageBucket: "dia-ros.firebasestorage.app",
        messagingSenderId: "233753558416",
        appId: "1:233753558416:web:d9f2dfc86593a1c996c715"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app); 

    window.firebaseAuth = auth;

    // 🔒 የአካባቢ ማከማቻ ቁልፎችን በመለያ መለየት (Local Data Isolation)
    window.getDbKey = function() {
        return auth.currentUser ? `_DIA_DATA_${auth.currentUser.uid}` : '_DIA_DATA_V10_DUAL';
    };
    window.getSubKey = function() {
        return auth.currentUser ? `_DIA_SUBS_${auth.currentUser.uid}` : '_DIA_SUBS_PERMANENT';
    };

    // 🔄 የባለቤትነት ሉዓላዊነትን የማረጋገጥ እና ራስ-ሰር መግቢያ መቆጣጠሪያ
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const snapshot = await get(ref(db, `users_profile/${user.uid}`));
                if (snapshot.exists()) {
                    const profile = snapshot.val();
                    
                    document.getElementById('view_g').value = profile.assignedGrade;
                    document.getElementById('view_g').disabled = true; 
                    document.getElementById('view_s').value = profile.assignedSection;
                    document.getElementById('view_s').disabled = true; 

                    window.currentGrade = profile.assignedGrade;
                    window.currentSection = profile.assignedSection;

                    if (profile.settings) {
                        document.getElementById('h_s').value = profile.settings.schoolName || "DILIGENT INTELLECTUALS ACADEMY";
                        document.getElementById('h_y').value = profile.settings.academicYear || "2018 E.C";
                        document.getElementById('h_b').value = profile.settings.subjects || "Math, English, Amharic, Science, IT";
                        document.getElementById('h_m').value = profile.settings.mode || "quarter";
                    }
                }
                
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                
                loadDataFromStorage();
                initApp(); 
                window.listenToCurrentClassCloud(); 
            } catch (error) {
                console.error("Session sync failed: ", error);
            }
        } else {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    });

        const fakeEmail = `${phone}@school.com`;

        try {
            await signInWithEmailAndPassword(auth, fakeEmail, password);
        } catch (error) {
            alert("የመግቢያ ስህተት፦ የስልክ ቁጥሩ ወይም የግል ማለፊያ ቃሉ አልተገኘም!");
        }
    };

    // 🟢 2) SIGN UP FUNCTION (መምህሩ የራሱን የግል ፓስወርድ መርጦ የሚመዘገብበት) [1]
    window.handleSignUp = async function() {
        const phone = document.getElementById('phoneInput')?.value.trim();
        const personalPassword = document.getElementById('passInput')?.value.trim();
        const classPassword = document.getElementById('classCodeInput')?.value.trim().toLowerCase(); 
        const selectedGrade = document.getElementById('signUpGrade')?.value;
        const selectedSection = document.getElementById('signUpSection')?.value; 

        const classKeys = {
            "Grade_1": "dia1111", "Grade_2": "dia2222", "Grade_3": "dia3333", "Grade_4": "dia4444",
            "Grade_5": "dia5555", "Grade_6": "dia6666", "Grade_7": "dia7777", "Grade_8": "dia8888",
            "Grade_9": "dia9999", "Grade_10": "dia1010", "Grade_11": "dia1111", "Grade_12": "dia1212"
        };

        if(!phone || !personalPassword || !classPassword) {
            alert("እባክዎ ስልክ ቁጥር፣ የግል ማለፊያ ቃል እና የክፍል መለያ በትክክል ይሙሉ!");

        if (personalPassword.length < 6) {

        if (classPassword !== classKeys[selectedGrade]) {
            alert("ያስገቡት የክፍል መለያ ኮድ (Class Code) ስህተት ነው!");
            return;

        const fakeEmail = `${phone}@school.com`;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, personalPassword);
            const user = userCredential.user;

            await set(ref(db, `users_profile/${user.uid}`), {

    // 🚪 3) LOGOUT FUNCTION
    window.handleLogout = async function() {

    // ⚙️ 4) SYNC SETTINGS
    window.syncSettingsWithCloud = async function() {
        const currentUser = auth.currentUser;
        if (!currentUser) return;

        const academicYear = document.getElementById('h_y').value.trim();
        const subjects = document.getElementById('h_b').value.trim();
        const mode = document.getElementById('h_m').value;

        try {

                schoolName,
                academicYear,
                subjects,
                mode
            });
        } catch (err) {
            console.error("Failed to sync settings: ", err);
        }
    };

    // 🔄 5) SMART MERGE CONFLICT RESOLUTION
    window.listenToCurrentClassCloud = async function() {
        const status = document.getElementById('cloudStatus');
        const vg = document.getElementById('view_g').value.trim().replace(/\s+/g, '_');
        const vs = document.getElementById('view_s').value.trim();
        const currentUser = auth.currentUser;

        if (!currentUser) return;

        if (status) {
            status.innerText = "Connecting Cloud...";
            status.className = "sync-badge";
        }

        const classRef = ref(db, `rosters/${currentUser.uid}/${vg}/${vs}`);

        try {
            const snapshot = await get(classRef);
            if (snapshot.exists()) {
                const cloudData = snapshot.val() || [];
                DATA = mergeRosters(DATA, cloudData);
                
                localStorage.setItem(window.getDbKey(), JSON.stringify(DATA));
                if (typeof renderTable === "function") renderTable();

                if (status) {
                    status.innerText = "Cloud: Connected (Synced)";
                    status.className = "sync-badge sync-on";
                }
            } else {
                if (DATA && DATA.length > 0) {
                    window.syncWithCloud();
                } else {
                    DATA = [];
                    if (typeof renderTable === "function") renderTable();
                }
                if (status) {
                    status.innerText = "Cloud: Ready (New)";
                    status.className = "sync-badge sync-on";
                }
            }
        } catch (err) {
            console.error("Cloud Access Error: ", err);
            if (typeof renderTable === "function") renderTable();
            if (status) {
                status.innerText = "Cloud: Offline (Local Mode)";
                status.className = "sync-badge sync-off";
            }
        }
    };

    function mergeRosters(local, remote) {
        const mergedMap = new Map();
        local.forEach(item => mergedMap.set(item.id, item));
        remote.forEach(item => {
            const existing = mergedMap.get(item.id);
            if (!existing || (item.updatedAt && (!existing.updatedAt || item.updatedAt > existing.updatedAt))) {
                mergedMap.set(item.id, item);
            }
        });
        return Array.from(mergedMap.values());
    }

    let syncTimeout;
    window.syncWithCloud = function() {
        const status = document.getElementById('cloudStatus');
        if (status) status.innerText = "Queueing Sync...";
        
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(async () => {
            const vg = document.getElementById('view_g').value.trim().replace(/\s+/g, '_');
            const vs = document.getElementById('view_s').value.trim();
            const currentUser = auth.currentUser;
            
            if (!currentUser) return;
            if (status) status.innerText = "Saving Online...";
            
            try {
                await set(ref(db, `rosters/${currentUser.uid}/${vg}/${vs}`), DATA);
                if(status) {
                    status.innerText = "Cloud: Synced";
                    status.className = "sync-badge sync-on";
                }
            } catch (err) {
                console.error("Auto Sync Error: " + err.message);
                if(status) {
                    status.innerText = "Cloud: Offline (Saved Locally)";
                    status.className = "sync-badge sync-off";
                }
            }
        }, 1500); 
    };

    window.pullFromCloud = async function() {
        const vg = document.getElementById('view_g').value.trim().replace(/\s+/g, '_');
        const vs = document.getElementById('view_s').value.trim();
        const dbRef = ref(db);
        const currentUser = auth.currentUser;
        
        if (!currentUser) return;
        
        try {

            if (snapshot.exists()) {
                if(confirm("ክላውድ ላይ ያለውን ዳታ አውርጄ አሁን ያለውን ልተካው?")) {
                    DATA = snapshot.val() || [];
                    localStorage.setItem(window.getDbKey(), JSON.stringify(DATA));
                    if (typeof renderTable === "function") renderTable();
                    alert("ዳታው ከክላውድ ወርዷል!");
                }
            } else {
                alert("በዚህ ክፍል ክላውድ ላይ ምንም ዳታ አልተገኘም!");
            }
        } catch (err) {
            alert("Error: " + err.message);
        }
    };
</script>

<script>
const DB_KEY = '_DIA_DATA_V10_DUAL';
const SUB_KEY = '_DIA_SUBS_PERMANENT';
const STATE_KEY = '_DIA_STATE';

let DATA = []; 
let SUBJECTS = [];

window.toggleForm = function() {
    const form = document.getElementById('inputForm');
    if (form) {
        form.classList.toggle('collapsed');
    }
};

function loadDataFromStorage() {
    const key = (typeof window.getDbKey === "function") ? window.getDbKey() : DB_KEY;
    DATA = JSON.parse(localStorage.getItem(key)) || [];
}

function initApp() {
    const subKey = (typeof window.getSubKey === "function") ? window.getSubKey() : SUB_KEY;
    const savedSubs = localStorage.getItem(subKey);
    if(savedSubs) document.getElementById('h_b').value = savedSubs;

    const currentGrade = window.currentGrade || document.getElementById('view_g')?.value || "Grade_1";
    const currentSection = window.currentSection || document.getElementById('view_s')?.value || "A";

    document.getElementById('view_g').value = currentGrade;
    document.getElementById('view_s').value = currentSection;

    SUBJECTS = document.getElementById('h_b').value.split(',').map(x => x.trim()).filter(x => x);
    const mode = document.getElementById('h_m').value;
    
    document.getElementById('e_t').innerHTML = mode === 'semester' 
        ? '<option value="1">Sem 1 / 1ኛ ሴሚ</option><option value="2">Sem 2 / 2ኛ ሴሚ</option>' 
        : '<option value="1">Q 1 / 1ኛ ኳርተር</option><option value="2">Q 2 / 2ኛ ኳርተር</option><option value="3">Q 3 / 3ኛ ኳርተር</option><option value="4">Q 4 / 4ኛ ኳርተር</option>';
    
    document.getElementById('subjectInputs').innerHTML = SUBJECTS.map((s, i) => `
        <div class="fld"><label>${s}</label><input type="number" class="mark-input" data-subj="${s}" id="m_${i}" 
        style="width:40px;text-align:center" oninput="autoJump(${i})" onkeydown="handleEnter(event, ${i})"></div>
    `).join('');
    
    updateNextID(); 

    if (typeof renderTable === "function") {
        renderTable();
    }
}

// 🎯 አዲሱ ሙሉ በሙሉ የተስተካከለ የ auto-comment ስሌት (Dynamic Evaluation with no missing gaps)
function getAutoComment(avg) {
    if (avg === undefined || avg === null || isNaN(avg) || avg === "-") return "-";
    const score = Number(avg);
    if (score >= 90) return "Excellent";
    if (score >= 80) return "V. Good";
    if (score >= 70) return "Good";
    if (score >= 60) return "Satisfactory"; // 60-70 ያለውን ክፍተት ለመሙላት
    if (score >= 50) return "Fair";         // 50-60
    return "Poor";                          // ከ 50 በታች
}

function handleModeChange() { initApp(); }
function autoJump(idx) { if (document.getElementById(`m_${idx}`).value.length >= 2) { const next = document.getElementById(`m_${idx + 1}`); if (next) next.focus(); else document.getElementById('saveBtn').focus(); } }
function handleEnter(e, idx) { if (e.key === 'Enter') { e.preventDefault(); const next = document.getElementById(`m_${idx + 1}`); if (next) next.focus(); else saveData(); } }

function saveSubs() { 
    const subKey = (typeof window.getSubKey === "function") ? window.getSubKey() : SUB_KEY;
    localStorage.setItem(subKey, document.getElementById('h_b').value); 
    SUBJECTS = document.getElementById('h_b').value.split(',').map(x => x.trim()).filter(x => x); 
    initApp(); 
}

function updateViewState() { 
    localStorage.setItem(STATE_KEY, JSON.stringify({g: document.getElementById('view_g').value, s: document.getElementById('view_s').value})); 
    updateNextID(); 
    renderTable(); 
}

function handlePrintRoster() { document.body.classList.remove('printing-cards'); document.body.classList.add('printing-roster'); window.print(); }

function handlePrintCards() {
    const vg = document.getElementById('view_g').value, 
          vs = document.getElementById('view_s').value;
    const mode = document.getElementById('h_m').value;
    
    let classData = DATA.filter(d => d.grade === vg && d.sec === vs && d.mode === mode);
    
    const uniqueStudents = [];
    const seen = new Set();
    for (const item of classData) {
        if(!seen.has(item.no)){
            seen.add(item.no);
            uniqueStudents.push(item);
        }
    }
    
    uniqueStudents.sort((a, b) => a.name.localeCompare(b.name, 'am'));

    document.getElementById('cardView').innerHTML = uniqueStudents.map(s => {
        return buildCardHTML(s.no, vg, vs, classData); 
    }).join('');

    document.body.classList.remove('printing-roster'); 
    document.body.classList.add('printing-cards');
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function updateNextID() {
    const vg = document.getElementById('view_g').value, vs = document.getElementById('view_s').value;
    const mode = document.getElementById('h_m').value;
    const classData = DATA.filter(d => d.grade === vg && d.sec === vs && d.mode === mode);
    const students = [...new Set(classData.map(d => parseInt(d.no)))];
    document.getElementById('e_n').value = students.length > 0 ? Math.max(...students) + 1 : 1;
}

function getRank(avg, allAvgs) {
    if(!avg || allAvgs.length === 0) return "-";
    const filtered = allAvgs.filter(v => v !== null && v > 0);
    const sorted = [...new Set(filtered)].sort((a,b) => b-a);
    return (sorted.indexOf(avg) + 1) + "/" + filtered.length;
}

function renderTable() {
    const vg = document.getElementById('view_g').value,

                    Teacher's Signature<br>የመምህሩ ፊርማ
                </div>
                <div class="roster-sig-box" style="width: 45%; border-top: 2px solid #000; text-align: center; padding-top: 8px; font-weight: 900; font-size: 11px; color: #000;">
                    Director's Signature<br>የዳይሬክተሩ ፊርማ
                </div>
            </div>
        </div>
    `;

    let footerDiv = document.getElementById('rosterFooterContainer');
    if(!footerDiv) {
        footerDiv = document.createElement('div');
        footerDiv.id = 'rosterFooterContainer';
        footerDiv.style.width = "100%";
        document.getElementById('mainTable').parentNode.insertBefore(footerDiv, document.getElementById('mainTable').nextSibling);
    }
    footerDiv.innerHTML = footerHtml;
}

function renderSubRow(no, g, s, terms, label, cData, isAnn=false) {
    const recs = cData.filter(d => d.no == no && terms.includes(Number(d.term)));
    if(recs.length === 0) return "";
    
    const avg = parseFloat((recs.reduce((sum, r) => sum + r.avg, 0) / recs.length).toFixed(2));
    const totalSum = parseFloat((recs.reduce((sum, r) => sum + r.total, 0) / recs.length).toFixed(2));
    
    const allIds = [...new Set(cData.map(d => d.no))];
    const groupAvgs = allIds.map(id => {
        const sr = cData.filter(d => d.no == id && terms.includes(Number(d.term)));
        return sr.length > 0 ? parseFloat((sr.reduce((sum, r) => sum + r.avg, 0) / sr.length).toFixed(2)) : null;
    }).filter(v => v !== null);
    
    let rowStyle = "";
    if (isAnn) {
        rowStyle = "background-color: #fef3c7 !important; color: #92400e !important; font-weight: 900 !important;";
    } else if (label.toUpperCase().includes("SEM 1")) {
        rowStyle = "background-color: #e0f2fe !important; color: #0369a1 !important; font-weight: 900 !important;";
    } else if (label.toUpperCase().includes("SEM 2")) {
        rowStyle = "background-color: #e0e7ff !important; color: #4338ca !important; font-weight: 900 !important;";
    } else {
        rowStyle = "background-color: #f1f5f9 !important; color: #334155 !important; font-weight: bold !important;";
    }
    
    rowStyle += " -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;";

    return `<tr style="${rowStyle} border: 2px solid #000;">
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">${label}</td>
        ${SUBJECTS.map(sub => `<td style="color: inherit; border: 2px solid #000; font-weight: 900;">${(recs.reduce((u,r)=>u+(r.marks[sub]||0),0)/recs.length).toFixed(2)}</td>`).join('')}
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">${totalSum.toFixed(2)}</td>
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">${avg.toFixed(2)}</td>
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">${getRank(avg, groupAvgs)}</td>
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">-</td>
        <td style="color: inherit; border: 2px solid #000; font-weight: 900;">-</td>
        <td class="btn-modal-hide" style="border: 2px solid #000;">
            ${isAnn ? `<button onclick="showCard('${no}','${g}','${s}')" style="cursor:pointer; font-weight:900;">CARD</button>` : '-'}
        </td>
    </tr>`;
}

function showCard(no, g, s) {
    const mode = document.getElementById('h_m').value;
    const classData = DATA.filter(d => d.grade === g && d.sec === s && d.mode === mode);
    document.getElementById('cardView').innerHTML = buildCardHTML(no, g, s, classData);
    document.body.classList.remove('printing-roster');
    document.body.classList.add('printing-cards');
    document.getElementById('modal').style.display = 'block';
}

function buildCardHTML(no, g, s, classData) {
    const recs = classData.filter(d => d.no == no).sort((a,b) => a.term - b.term);
    if(recs.length === 0) return "";
    
    const school = document.getElementById('h_s').value;
    const year = document.getElementById('h_y').value;
    const mode = document.getElementById('h_m').value;
    const allIds = [...new Set(classData.map(d => d.no))];
    const totalStudents = allIds.length;

    let dynamicSubjects = SUBJECTS; 

    let tableHtml = `<table class="card-table" style="width:100%; border-collapse:collapse; border: 2.5px solid #000; font-weight: 900 !important; color: #000; font-size: 10px;">
        <thead style="background-color: #eee !important; -webkit-print-color-adjust: exact;">
            <tr><th rowspan="2" style="border: 1.5px solid #000; padding: 2px; text-align: center; font-weight: 900 !important;">SUBJECTS</th>`;
    
    if(mode === 'quarter') {
        tableHtml += `<th colspan="3" style="border: 1.5px solid #000; font-weight: 900 !important;">Semester One</th><th colspan="3" style="border: 1.5px solid #000; font-weight: 900 !important;">Semester Two</th><th rowspan="2" style="border: 1.5px solid #000; font-weight: 900 !important;">Annual</th></tr>
                      <tr style="font-size: 8.5px; font-weight: 900 !important;"><th>Q1</th><th>Q2</th><th>AVG</th><th>Q3</th><th>Q4</th><th>AVG</th></tr></thead><tbody>`;
    } else {
        tableHtml += `<th style="border: 1.5px solid #000; font-weight: 900 !important;">Semester One</th><th style="border: 1.5px solid #000; font-weight: 900 !important;">Semester Two</th><th style="border: 1.5px solid #000; background:#fefce8 !important; font-weight: 900 !important;">Annual</th></tr></thead><tbody>`;
    }
    
    dynamicSubjects.forEach(sub => {
        const getM = (t) => {
            const r = recs.find(rx => rx.term == t);
            return (r && r.marks[sub] !== undefined && r.marks[sub] !== "") ? Number(r.marks[sub]) : "-";
        };

        if(mode === 'quarter') {
            const q = [1, 2, 3, 4].map(t => getM(t));
            const s1 = (typeof q[0]==='number' && typeof q[1]==='number') ? ((q[0]+q[1])/2).toFixed(2) : "-";
            const s2 = (typeof q[2]==='number' && typeof q[3]==='number') ? ((q[2]+q[3])/2).toFixed(2) : "-";
            const vMarks = q.filter(m => typeof m === 'number');
            const ann = vMarks.length > 0 ? (vMarks.reduce((a, b) => a + b, 0) / vMarks.length).toFixed(2) : "-";

            tableHtml += `<tr style="border: 1.5px solid #000; text-align: center; font-weight: 900 !important;">
                <td style="text-align:center; padding: 2px; border: 1.5px solid #000; font-size: 10px; white-space: normal;">${sub}</td>
                <td style="border: 1.5px solid #000;">${q[0]}</td><td style="border: 1.5px solid #000;">${q[1]}</td><td style="background-color: #f3f4f6 !important; border: 1.5px solid #000;">${s1}</td>
                <td style="border: 1.5px solid #000;">${q[2]}</td><td style="border: 1.5px solid #000;">${q[3]}</td><td style="background-color: #f3f4f6 !important; border: 1.5px solid #000;">${s2}</td>
                <td style="background-color: #fefce8 !important; border: 2.5px solid #000;">${ann}</td>
            </tr>`;
        } else {
            const s1 = getM(1), s2 = getM(2);
            const vMarks = [s1, s2].filter(m => typeof m === 'number');
            const ann = vMarks.length > 0 ? (vMarks.reduce((a, b) => a + b, 0) / vMarks.length).toFixed(2) : "-";
            tableHtml += `<tr style="border: 1.5px solid #000; text-align: center; font-weight: 900 !important;">
                <td style="text-align:center; padding: 2px; border: 1.5px solid #000;">${sub}</td>
                <td style="border: 1.5px solid #000;">${s1}</td><td style="border: 1.5px solid #000;">${s2}</td><td style="background-color: #fefce8 !important; border: 2.5px solid #000;">${ann}</td>
            </tr>`;
        }
    });

    const metrics = [
        {label: 'TOTAL', key: 'TOTAL'}, {label: 'AVG', key: 'AVG'}, {label: 'RANK', key: 'RANK'}, 
        {label: 'CONDUCT', key: 'COND'}, {label: 'ABSENT', key: 'ABS'}, {label: 'COMMENT', key: 'COMM'}
    ];

    metrics.forEach(m => {
        tableHtml += `<tr style="border: 1.5px solid #000; font-weight: 900 !important; text-align: center;">
            <td style="text-align:center; padding: 2px; font-size:9px; background-color: #f3f4f6 !important; border: 1.5px solid #000;">${m.label}</td>`;
        
        const colTerms = mode === 'quarter' ? [1, 2, 'S1', 3, 4, 'S2'] : [1, 2];
        
        colTerms.forEach(t => {
            let val = "-";
            const isAvgCol = (t === 'S1' || t === 'S2');
            const targetTerms = isAvgCol ? (t === 'S1' ? [1, 2] : [3, 4]) : [Number(t)];
            const sRecs = recs.filter(r => targetTerms.includes(Number(r.term)));
            
            if (sRecs.length > 0 || isAvgCol) {
                const currentAvg = sRecs.length > 0 ? (sRecs.reduce((sum, r) => sum + (Number(r.avg) || 0), 0) / sRecs.length) : 0;
                
                if (m.key === 'TOTAL' && sRecs.length > 0) {
                    val = sRecs.reduce((sum, r) => sum + (Number(r.total) || 0), 0).toFixed(2);
                }
                else if (m.key === 'AVG' && sRecs.length > 0) {
                    val = currentAvg.toFixed(2);
                }
                else if (m.key === 'RANK' && sRecs.length > 0) {
                    const allAvgs = allIds.map(id => {
                        const sr = classData.filter(d => d.no == id && targetTerms.includes(Number(d.term)));
                        return sr.length > 0 ? (sr.reduce((sum, rx) => sum + (Number(rx.avg) || 0), 0) / sr.length) : null;
                    }).filter(v => v !== null);
                    
                    let rankNum = typeof getRank === 'function' ? getRank(currentAvg, allAvgs) : "-";
                    if(String(rankNum).includes('/')) rankNum = rankNum.split('/')[0];
                    val = rankNum + "/" + totalStudents;
                }
                else if (m.key === 'COMM') {
                    // 👉 ራስ-ሰር አስተያየትን በእያንዳንዱ አምድ አማካይ ውጤት መሠረት በቅጽበት ማስላት (Dynamically evaluate from column average)
                    val = getAutoComment(currentAvg);
                }
                else if (m.key === 'COND' || m.key === 'ABS') {
                    val = isAvgCol ? "" : (m.key === 'COND' ? (sRecs[sRecs.length-1].conduct || "-") : sRecs.reduce((sum, r) => sum + (Number(r.absent) || 0), 0));
                }
            }
            tableHtml += `<td style="font-size:8px; border: 1.5px solid #000; max-width:90px; white-space: normal; word-break: break-word; padding: 2px;">${val}</td>`;
        });

        const annAvg = recs.length > 0 ? (recs.reduce((sum, r) => sum + (Number(r.avg) || 0), 0) / recs.length) : 0;
        let annVal = "-";
        if (recs.length > 0) {
            if (m.key === 'TOTAL') {
                annVal = recs.reduce((sum, r) => sum + (Number(r.total) || 0), 0).toFixed(2);
            }
            else if (m.key === 'AVG') {
                annVal = annAvg.toFixed(2);
            }
            else if (m.key === 'RANK') {
                const allAnnAvgs = allIds.map(id => {
                    const sr = classData.filter(d => d.no == id);
                    return sr.length > 0 ? (sr.reduce((sum, rx) => sum + (Number(rx.avg) || 0), 0) / sr.length) : null;
                }).filter(v => v !== null);
                
                let annRankNum = typeof getRank === 'function' ? getRank(annAvg, allAnnAvgs) : "-";
                if(String(annRankNum).includes('/')) annRankNum = annRankNum.split('/')[0];
                annVal = annRankNum + "/" + totalStudents;
            } 
            else if (m.key === 'ABS') {
                annVal = recs.reduce((sum, r) => sum + (Number(r.absent) || 0), 0);
            }
            else if (m.key === 'COND') {
                annVal = recs[recs.length-1].conduct || "-";
            }
            else if (m.key === 'COMM') {
                // 👉 አመታዊ አስተያየትን ከአመታዊ ጠቅላላ አማካዩ ውጤት መሠረት በቅጽበት ማስላት (Dynamically evaluate from annual average)
                annVal = getAutoComment(annAvg);
            }
        }
        tableHtml += `<td style="background:#fefce8 !important; border: 2.5px solid #000; text-align:center; font-size: 8px; max-width:90px; white-space: normal; word-break: break-word;">${annVal}</td></tr>`;
    });

    tableHtml += `</tbody></table>`;

    return `<div class="card-content" style="height: auto !important; min-height: 135mm; box-sizing: border-box; padding: 3mm; page-break-inside: avoid; display: flex; flex-direction: column;">
        <div style="border: 3.5px solid #1e3a8a; height: 100%; display: flex; flex-direction: column; background: #fff; font-weight: 900 !important; flex-grow: 1;">
            <div style="background-color: #eff6ff !important; padding: 6px; text-align: center; border-bottom: 2.5px solid #1e3a8a; -webkit-print-color-adjust: exact;">
                <h2 style="margin: 0; color: #1e3a8a; font-size: 1.3em; font-weight: 900;">${school}</h2>
                <div style="font-weight: 900; color: #1e3a8a; font-size: 11px;">STUDENT PROGRESS REPORT CARD (${year})</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; padding: 6px; font-weight: 900; border-bottom: 2.5px solid #1e3a8a; font-size: 11px; color: #000;">
                <div>Name: <span style="text-decoration: underline;">${recs[0].name}</span></div>
                <div>ID: <span style="text-decoration: underline;">${no}</span></div>
                <div>Grade: <span style="text-decoration: underline;">${g} - ${s}</span></div>
                <div>Sex: <span style="text-decoration: underline;">${recs[0].sex}</span></div>
            </div>
            <div style="padding: 4px; flex-grow: 1;">${tableHtml}</div>
            
            <div style="padding: 15px 8px 5px 8px; display: flex; justify-content: space-between; font-weight: 900; font-size: 11px; margin-top: auto; color: #000;">
                <div style="text-align: center; width: 40%; border-top: 1.5px solid #000; padding-top: 5px;">Teacher's Signature / የመምህሩ ፊርማ</div>
                <div style="text-align: center; width: 40%; border-top: 1.5px solid #000; padding-top: 5px;">Director's Signature / የዳይሬክተሩ ፊርማ</div>
            </div>
        </div>
    </div>`;
}

function saveData() {
    const name = document.getElementById('e_m').value.trim();
    if(!name) return alert("Enter Name / ስም ያስገቡ!");
    
    const age = parseInt(document.getElementById('e_a').value);
    if (isNaN(age) || age < 4 || age > 100) {
        return alert("እባክዎ ትክክለኛ የተማሪ እድሜ ያስገቡ (ከ4 እስከ 100)!");
    }

    const absent = parseInt(document.getElementById('e_abs').value || 0);
    if (isNaN(absent) || absent < 0) {
        return alert("የቀረበት ቀን ከ0 በታች መሆን አይችልም!");
    }

    const currentTerm = parseInt(document.getElementById('e_t').value);
    const mode = document.getElementById('h_m').value;
    let marks = {}, total = 0;
    let validationError = false;

    document.querySelectorAll('.mark-input').forEach(i => { 
        let v = parseFloat(i.value); 
        if (isNaN(v)) {
            v = 0; 
        }
        if (v < 0 || v > 100) {
            alert(`የውጤት ወሰን ስህተት፦ ለትምህርት ዓይነት "${i.dataset.subj}" ያስገቡት ውጤት (${v}) ከ0 በታች ወይም ከ100 በላይ መሆን አይችልም!`);
            validationError = true;
        }
        marks[i.dataset.subj] = v; 
        total += v; 
    });

    if (validationError) return;

    const finalTotal = parseFloat(total.toFixed(2));
    const avg = parseFloat((total / SUBJECTS.length).toFixed(2));

    const isEdit = document.getElementById('e_id').value !== "-1";
    const entry = {
        id: isEdit ? parseFloat(document.getElementById('e_id').value) : Date.now(),
        no: document.getElementById('e_n').value, 
        name, 
        sex: document.getElementById('e_x').value, 
        age,
        grade: document.getElementById('view_g').value, 
        sec: document.getElementById('view_s').value,
        mode: mode, 
        term: currentTerm, 
        conduct: document.getElementById('e_c').value, 
        absent,
        comment: document.getElementById('e_com').value || getAutoComment(avg), 
        marks, 
        total: finalTotal, 
        avg: avg,
        updatedAt: Date.now() 
    };
    
    const idx = DATA.findIndex(d => d.id === entry.id);
    if(idx > -1) DATA[idx] = entry; else DATA.push(entry);
    
    const key = (typeof window.getDbKey === "function") ? window.getDbKey() : DB_KEY;
    localStorage.setItem(key, JSON.stringify(DATA));
    
    if(typeof syncWithCloud === 'function') syncWithCloud();

    if(!isEdit) {
        if((mode==='quarter' && currentTerm < 4) || (mode==='semester' && currentTerm < 2)) {
            document.getElementById('e_t').value = currentTerm + 1;
            document.querySelectorAll('.mark-input').forEach(i => i.value = ""); 
            document.getElementById('e_com').value = "";
            document.getElementById('m_0').focus();
        } else {
            resetFields(); 
            document.getElementById('e_t').value = 1; 
            updateNextID(); 
            document.getElementById('e_m').focus();
        }
    } else { resetFields(); updateNextID(); }
    renderTable();
}

function delRec(id) { 
    if(confirm("Delete? / ላጥፋው?")) { 
        DATA = DATA.filter(d => d.id !== id); 
        const key = (typeof window.getDbKey === "function") ? window.getDbKey() : DB_KEY;
        localStorage.setItem(key, JSON.stringify(DATA)); 
        if(typeof syncWithCloud === 'function') syncWithCloud(); 
        renderTable(); 
    } 
}

function resetFields() { 
    document.getElementById('e_id').value = "-1"; 
    document.getElementById('e_m').value = ""; 
    document.getElementById('e_a').value = ""; 
    document.getElementById('e_abs').value = "0"; 
    document.querySelectorAll('.mark-input').forEach(i => i.value = "");
    document.getElementById('e_com').value = "";
}

function editRec(id) {
    const r = DATA.find(d => d.id === id);
    if(!r) return;
    document.getElementById('e_id').value = r.id;
    document.getElementById('e_n').value = r.no;
    document.getElementById('e_m').value = r.name;
    document.getElementById('e_x').value = r.sex;
    document.getElementById('e_a').value = r.age;
    document.getElementById('e_t').value = r.term;
    document.getElementById('e_c').value = r.conduct;
    document.getElementById('e_abs').value = r.absent;
    document.getElementById('e_com').value = r.comment || "";
    SUBJECTS.forEach((s, i) => {
        if(document.getElementById(`m_${i}`)) document.getElementById(`m_${i}`).value = r.marks[s] || "";
    });
    if(document.getElementById('inputForm').classList.contains('collapsed')) toggleForm();
    document.getElementById('m_0').focus();
}

function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DATA));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `DIA_Backup.json`);
    dlAnchorElem.click();
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if(Array.isArray(importedData)) {
                if(confirm("የመጣውን ዳታ አሁን ካለው ዳታ ጋር ልቀላቅለው (Merge)? 'Cancel' ካሉ የነበረው ጠፍቶ በአዲሱ ይተካል::")) {
                    DATA = DATA.concat(importedData);
                } else {
                    DATA = importedData;
                }
                const key = (typeof window.getDbKey === "function") ? window.getDbKey() : DB_KEY;
                localStorage.setItem(key, JSON.stringify(DATA));
                renderTable();
                alert("ዳታው በተሳካ ሁኔታ ተመልሷል!");
                if(typeof syncWithCloud === 'function') syncWithCloud();
            } else {
                alert("ስህተት: ፋይሉ ትክክለኛ የሮስተር ዳታ አይደለም!");
            }
        } catch (err) {
            alert("ፋይሉን ማንበብ አልተቻለም: " + err.message);
        }
    };
    reader.readAsText(file);
}

function addSubject() {
    let currentSubs = document.getElementById('h_b').value.trim();
    let newSub = prompt("ሊጨምሩት የሚፈልጉትን የትምህርት ስም ያስገቡ (ለምሳሌ፦ Civics):");
    if(newSub && newSub.trim()) {
        document.getElementById('h_b').value = currentSubs ? currentSubs + ", " + newSub.trim() : newSub.trim();
        saveSubs();
        if(typeof window.syncSettingsWithCloud === 'function') window.syncSettingsWithCloud();
    }
}

function clearAllData() {
    if(confirm("ማስጠንቀቂያ! ሁሉንም የተማሪዎች ዳታ ሙሉ በሙሉ ማጥፋት ይፈልጋሉ? ይህ ድርጊት ወደኋላ አይመለስም!")) {
        DATA = [];
        const key = (typeof window.getDbKey === "function") ? window.getDbKey() : DB_KEY;
        localStorage.setItem(key, JSON.stringify(DATA));
        if(typeof syncWithCloud === 'function') syncWithCloud();
        renderTable();
        updateNextID();
        alert("ሁሉም ዳታ ጠፍቷል!");
    }
}
