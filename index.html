<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DIA Grade Pro - Bold Borders Edition</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22DIAGradePro%22,%22short_name%22:%22GradePro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#1e40af%22,%22theme_color%22:%22#1e40af%22}">

<style>
:root{--p:#1e40af;--s:#15803d;--d:#b91c1c;--bg:#f1f5f9;--w:#f59e0b;--card-blue:#1e3a8a;--tg:#0088cc}
*{box-sizing:border-box;font-family: 'Nyala', 'Abyssinica SIL', 'Segoe UI', sans-serif}
body{margin:0;background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.roster-print-header { display: none; text-align: center; border-bottom: 3px double #000; margin-bottom: 15px; padding: 10px; background: #fff; }

@media print {
    @page { size: A4 landscape; margin: 5mm; }
    .btn-modal-hide, .app-header, .top, .bar, .stats-bar, .btn, #login, .no-print, .sync-badge { display: none !important; }
    body, html { background: white !important; overflow: visible !important; height: auto !important; width: 100% !important; display: block !important; color: #000 !important;}
    #app { display: block !important; }
    main { overflow: visible !important; display: block !important; padding: 0 !important; width: 100% !important; margin: 0 !important; }
    body.printing-roster .roster-print-header { display: block !important; }
    body.printing-roster #mainTable { width: 100% !important; border: 2.5px solid #000 !important; display: table !important; border-collapse: collapse !important;}
    
    body.printing-roster thead th { 
        background-color: #e2e8f0 !important; 
        color: #000000 !important; 
        font-weight: 900 !important; 
        font-size: 11px !important;
        border: 2px solid #000000 !important; 
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
    }
    body.printing-roster td { border: 1.5px solid #000 !important; font-weight: bold !important; font-size: 10px !important; padding: 3px !important;}
    body.printing-cards #tableContainer { display: none !important; }
    body.printing-cards #modal { display: block !important; position: relative !important; background: white !important; padding: 0 !important; width: 100% !important; }
    
    body.printing-cards .card-content { 
        width: 48% !important; 
        height: 138mm !important; 
        margin: 0 auto 4mm auto !important; 
        padding: 4mm !important; 
        border: 2.5px solid #1e3a8a !important; 
        page-break-inside: avoid !important; 
        break-inside: avoid !important; 
        display: inline-block !important; 
        box-sizing: border-box !important; 
        vertical-align: top;
        font-weight: bold !important; 
    }
}

.app-header { background: #111827; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--w); }
#login{position:fixed;inset:0;background:linear-gradient(45deg, #1e3a8a 0%, #3b82f6 100%);display:flex;align-items:center;justify-content:center;z-index:10000}
.login-box{background:rgba(255,255,255,0.15);padding:40px;border-radius:20px;border:2px solid rgba(255,255,255,0.5);backdrop-filter:blur(15px);text-align:center;color:#fff;width:320px}
#login input{padding:12px;border-radius:8px;border:none;margin:15px 0;width:100%;text-align:center;font-size:18px;background:#fff;color:#1e3a8a;font-weight:700}
.login-btn{padding:10px 0;width:100%;border-radius:30px;border:none;background:#fff;color:#1e3a8a;font-weight:700;cursor:pointer}

#app{display:none;flex-direction:column;height:100%}
.top { background: #fff; padding: 8px; border-bottom: 3px solid var(--p); display: block; }
.top.collapsed { display: none !important; }
.row { display: flex; gap: 5px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px }
.fld { display: flex; flex-direction: column }
label { font-size: 10px; font-weight: 700; color: #475569 }
input, select { padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; outline: 0; color: #000 }
.bar { background: #e2e8f0; padding: 10px; display: flex; gap: 8px; align-items: center; overflow-x: auto; border-bottom: 2px solid #cbd5e1 }
.btn { padding: 8px 14px; border: 0; border-radius: 4px; color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px }

main { flex: 1; overflow: auto; padding: 8px; background: #fff }

/* 🔴 Roster Borders Strengthened */
table { border-collapse: collapse; background: #fff; width: 100%; font-size: 11px; border: 2px solid #000; }
th, td { border: 1.5px solid #000; padding: 5px 6px; text-align: center; color: #000; }

th { 
    background: #1e293b; 
    color: #ffffff; 
    font-weight: 900; 
    font-size: 12px;
    letter-spacing: 0.5px;
    position: sticky; 
    top: 0; 
    z-index: 10; 
}

.stats-bar { display: flex; gap: 20px; padding: 10px; background: #f8fafc; border-top: 2px solid #cbd5e1; font-weight: bold; font-size: 13px; }
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; overflow-y: auto; padding: 20px }
.card-content { background: #fff; width: 165mm; margin: 0 auto 20px auto; padding: 5mm; border-radius: 4px; color: #000; }
.main-card-border { border: 3px solid var(--card-blue); padding: 5px; height: 100%; }
.card-header-box { text-align: center; border-bottom: 2.5px solid var(--card-blue); padding-bottom: 5px; margin-bottom: 8px; }
.card-title-main { font-size: 18px; font-weight: 900; color: var(--card-blue); margin: 0; }
.year-badge { display: inline-block; background: var(--card-blue); color: white; padding: 2px 15px; border-radius: 12px; font-size: 12px; margin-top: 4px; }

/* 🔴 Report Card Table Borders Harmonized */
.card-table { width: 100%; border-collapse: collapse; border: 2.5px solid #000 !important; }
.card-table th { border: 1.5px solid #000 !important; padding: 4px; background: #f1f5f9; color: #000; font-size: 11px; line-height: 1.2; font-weight: bold; }
.card-table td { border: 1.5px solid #000 !important; padding: 4px; text-align: center; font-weight: bold; font-size: 11px; color: #000; }

.sync-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 10px; font-weight: bold; }
.sync-on { background: #dcfce7; color: #166534; }
.sync-off { background: #fee2e2; color: #991b1b; }

.act-btn { border:none; background:none; cursor:pointer; font-size:12px; padding:2px 4px; }
.act-btn:hover { transform: scale(1.2); }
</style>
</head>
<body>

<div id="login">
    <div class="login-box">
        <h2>DIA ROSTER APP (ሮስተር)</h2>
        <input type="password" id="passInput" placeholder="Password (1234)">
        <button class="login-btn" onclick="checkLogin()">LOGIN / ግባ</button>
    </div>
</div>

<div id="app">
    <div class="app-header">
        <div style="display:flex; align-items:center">
            <div style="font-weight:900">DIA GRADE PRO / ዲአይኤ ግሬድ</div>
            <span id="cloudStatus" class="sync-badge sync-off">Cloud: Connecting...</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center">
            <span>Developed by: Taddesse M.</span>
            <button class="btn" style="background:var(--w); color:#000" onclick="toggleForm()">↕ እጠፍ/ዘርጋ (Fold)</button>
        </div>
    </div>
    
    <div class="top" id="inputForm">
        <div class="row">
            <div class="fld"><label>School Name / ትምህርት ቤት</label><input type="text" id="h_s" value="DILIGENT INTELLECTUALS ACADEMY" style="width:250px"></div>
            <div class="fld"><label>Mode / ዓይነት</label><select id="h_m" onchange="handleModeChange()"><option value="semester">Semester / ሴሚስተር</option><option value="quarter" selected>Quarter / ኳርተር</option></select></div>
            <div class="fld"><label>Year / ዓመተ ምሕረት</label><input type="text" id="h_y" value="2018 E.C" style="width:120px"></div>
            <div class="fld"><label>Subjects / ትምህርቶች (በኮማ ይለዩ)</label><input type="text" id="h_b" value="Math, English, Amharic, Science, IT" style="width:230px" oninput="saveSubs()"></div>
            <button class="btn" style="background:var(--d)" onclick="location.reload()">LOCK 🔒 መቆለፊያ</button>
        </div>
        <div class="row" style="border-top:1px solid #eee;padding-top:10px">
            <input type="hidden" id="e_id" value="-1">
            <div class="fld"><label>No. / ተራ ቁጥር</label><input type="number" id="e_n" readonly style="width:55px; background:#e2e8f0; font-weight:bold; text-align:center;"></div>
            <div class="fld"><label>Name / ስም</label><input type="text" id="e_m" style="width:160px"></div>
            <div class="fld"><label>Sex / ጾታ</label><select id="e_x"><option>Male</option><option>Female</option></select></div>
            <div class="fld"><label>Age / እድሜ</label><input type="number" id="e_a" style="width:40px"></div>
            <div class="fld"><label>Terms/ ክፍለ ጊዜ</label><select id="e_t" onchange="handleTermSelectManualChange()"></select></div>
            <div class="fld"><label>Conduct / ጠባይ</label><select id="e_c"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
            <div class="fld"><label>Absent / የቀረ</label><input type="number" id="e_abs" value="0" style="width:45px"></div>
            <div class="fld"><label>Note / አስተያየት</label><input type="text" id="e_com" style="width:180px" placeholder="Auto-generated if empty"></div>
            <div id="subjectInputs" style="display:flex;gap:4px"></div>
            <button class="btn" style="background:var(--s)" id="saveBtn" onclick="saveData()">💾 SAVE / መዝግብ</button>
            <button class="btn" style="background:#475569" onclick="clearFormForNewStudent(true)">➕ NEW STUDENT</button>
        </div>
        <div class="row" style="background:#fffbeb; padding:5px; border-radius:5px">
            <div class="fld"><label>GRADE / ክፍል</label><input type="text" id="view_g" value="Grade 4" style="width:70px" oninput="updateViewState()"></div>
            <div class="fld"><label>SEC / ምድብ</label><input type="text" id="view_s" value="A" style="width:40px" oninput="updateViewState()"></div>
        </div>
    </div>

    <div class="bar">
        <button class="btn" style="background:#475569" onclick="exportJSON()">📥 BACKUP / ኮፒ</button>
        <button class="btn" style="background:#0891b2" onclick="document.getElementById('importFile').click()">📤 RESTORE / መልስ</button>
        <button class="btn" style="background:#7c3aed" onclick="handlePrintCards()">🗂️ PRINT CARDS / ካርድ አትም</button>
        <button class="btn" style="background:var(--p)" onclick="handlePrintRoster()">📋 PRINT ROSTER / ሮስተር</button>
        <button class="btn" style="background:var(--s)" onclick="addSubject()">➕ ADD SUB / ትምህርት ጨምር</button>
        <button class="btn" style="background:var(--d)" onclick="clearAllData()">⚠️ CLEAR / አጥፋ</button>
        <button class="btn" style="background:var(--tg)" onclick="syncWithCloud()">☁️ PUSH CLOUD / ደመና ጫን</button>
        <button class="btn" style="background:#ea580c" onclick="pullFromCloud(true)">📥 PULL CLOUD / አውርድ</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
        <input type="text" id="searchQ" placeholder="🔍 ስም ፈልግ (Search)..." onkeyup="renderTable()" style="width:180px; flex-shrink:0">
    </div>

    <main id="tableContainer">
        <div id="rosterHeader" class="roster-print-header"></div>
        <table id="mainTable"></table>
    </main>
    <div class="stats-bar" id="statsBar">
        <span id="statM">M / ወ: 0</span> | <span id="statF">F / ሴ: 0</span> | <span id="statT">Total / ድምር: 0</span>
    </div>
</div>

<div id="modal">
    <div style="text-align:center; margin-bottom:15px" class="btn-modal-hide">
        <button class="btn" style="background:var(--d)" onclick="closeModal()">CLOSE / ዝጋ</button>
        <button class="btn" style="background:var(--s)" onclick="window.print()">PRINT / አትም</button>
    </div>
    <div id="cardView"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCIQLl6EGGscg35mSpFvhhGYSU84IANNxQ",
    authDomain: "dia-ros.firebaseapp.com",
    databaseURL: "https://dia-ros-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dia-ros",
    storageBucket: "dia-ros.firebasestorage.app",
    messagingSenderId: "233753558416",
    appId: "1:233753558416:web:d9f2dfc86593a1c996c715"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const SUB_KEY = '_DIA_SUBS_PERMANENT';
const STATE_KEY = '_DIA_STATE';

let DATA = []; 
let SUBJECTS = [];
let currentCloudRef = null;
let isFirstLoadComplete = false; 

function getLocalKey() {
    const vg = document.getElementById('view_g').value.trim().replace(/\s+/g, '_');
    const vs = document.getElementById('view_s').value.trim().replace(/\s+/g, '_');
    return `_LOCAL_DATA_${vg}_${vs}`;
}

function getCloudPath() {
    const vg = document.getElementById('view_g').value.trim().replace(/\s+/g, '_');
    const vs = document.getElementById('view_s').value.trim().replace(/\s+/g, '_');
    return `rosters/${vg}_${vs}`;
}

function startRealtimeSync() {
    const status = document.getElementById('cloudStatus');
    const path = getCloudPath();
    const localKey = getLocalKey();
    
    if (currentCloudRef) { currentCloudRef.off(); }
    
    status.innerText = "Connecting...";
    status.className = "sync-badge sync-off";
    isFirstLoadComplete = false;
    
    const backup = localStorage.getItem(localKey);
    if(backup) {
        DATA = JSON.parse(backup);
        renderTable();
        updateNextID();
    } else {
        DATA = [];
        renderTable();
    }
    
    currentCloudRef = db.ref(path);
    
    db.ref(".info/connected").on("value", function(snap) {
        if (snap.val() === true) {
            status.innerText = "Cloud: Online ✨";
            status.className = "sync-badge sync-on";
        } else {
            status.innerText = "Cloud: Offline ⚠️";
            status.className = "sync-badge sync-off";
        }
    });

    currentCloudRef.on('value', (snapshot) => {
        isFirstLoadComplete = true; 
        if (snapshot.exists()) {
            DATA = snapshot.val() || [];
            localStorage.setItem(localKey, JSON.stringify(DATA));
            renderTable();
            updateNextID();
        }
    }, (error) => {
        console.error("Cloud read failed: ", error);
        isFirstLoadComplete = true; 
    });
}

async function syncWithCloud() {
    const localKey = getLocalKey();
    localStorage.setItem(localKey, JSON.stringify(DATA));

    try {
        await db.ref(getCloudPath()).set(DATA);
        return true;
    } catch (err) {
        console.error("Sync failed:", err);
        alert("⚠️ ማስጠንቀቂያ፡ መረጃው ስልክዎ ላይ ተቀምጧል ነገር ግን ወደ ክላውድ አልተጫነም! Error: " + err.message);
        return false;
    }
}

window.pullFromCloud = async function(manual = false) {
    if(manual) {
        if(confirm("ክላውድ ላይ ያለውን ዳታ በኃይል አውርጄ አሁን ያለውን ልተካው?")) {
            startRealtimeSync();
        }
    }
};

function checkLogin() {
    if(document.getElementById('passInput').value === "1234") {
        document.getElementById('login').style.display='none';
        document.getElementById('app').style.display='flex';
        initApp(); 
    } else alert("Wrong Password! / የተሳሳተ የይለፍ ቃል!");
}

function initApp() {
    const savedSubs = localStorage.getItem(SUB_KEY);
    if(savedSubs) document.getElementById('h_b').value = savedSubs;
    
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if(s) { 
        document.getElementById('view_g').value = s.g; 
        document.getElementById('view_s').value = s.s; 
    }
    
    SUBJECTS = document.getElementById('h_b').value.split(',').map(x => x.trim()).filter(x => x);
    const mode = document.getElementById('h_m').value;
    
    document.getElementById('e_t').innerHTML = mode === 'semester' 
        ? '<option value="1">Sem 1</option><option value="2">Sem 2</option>' 
        : '<option value="1">Q 1</option><option value="2">Q 2</option><option value="3">Q 3</option><option value="4">Q 4</option>';
    
    document.getElementById('subjectInputs').innerHTML = SUBJECTS.map((s, i) => `
        <div class="fld"><label>${s}</label><input type="number" class="mark-input" data-subj="${s}" id="m_${i}" 
        style="width:40px;text-align:center" oninput="autoJump(${i})" onkeydown="handleEnter(event, ${i})"></div>
    `).join('');
    
    startRealtimeSync(); 
}

function getAutoComment(avg) {
    if (avg >= 90) return "Excellent";
    if (avg >= 80) return "Very Good";
    if (avg >= 70) return "Good";
    if (avg >= 60) return "Satisfactory";
    if (avg >= 50) return "Fair";
    return "Poor";
}

function handleModeChange() { initApp(); }
function toggleForm() { document.getElementById('inputForm').classList.toggle('collapsed'); }
function autoJump(idx) { if (document.getElementById(`m_${idx}`).value.length >= 2) { const next = document.getElementById(`m_${idx + 1}`); if (next) next.focus(); else document.getElementById('saveBtn').focus(); } }
function handleEnter(e, idx) { if (e.key === 'Enter') { e.preventDefault(); const next = document.getElementById(`m_${idx + 1}`); if (next) next.focus(); else saveData(); } }
function saveSubs() { localStorage.setItem(SUB_KEY, document.getElementById('h_b').value); SUBJECTS = document.getElementById('h_b').value.split(',').map(x => x.trim()).filter(x => x); initApp(); }

function updateViewState() { 
    localStorage.setItem(STATE_KEY, JSON.stringify({g: document.getElementById('view_g').value, s: document.getElementById('view_s').value})); 
    startRealtimeSync(); 
}

function handlePrintRoster() { document.body.classList.remove('printing-cards'); document.body.classList.add('printing-roster'); window.print(); }
function handlePrintCards() {
    const vg = document.getElementById('view_g').value, vs = document.getElementById('view_s').value;
    DATA.sort((a, b) => a.name.localeCompare(b.name, 'am'));
    document.getElementById('cardView').innerHTML = DATA.map(s => buildCardHTML(s.no, vg, vs, DATA)).join('');
    document.body.classList.remove('printing-roster'); 
    document.body.classList.add('printing-cards');
    document.getElementById('modal').style.display = 'block';
}

function showCard(studentNo) {
    const vg = document.getElementById('view_g').value, vs = document.getElementById('view_s').value;
    document.getElementById('cardView').innerHTML = buildCardHTML(studentNo, vg, vs, DATA);
    document.body.classList.remove('printing-roster'); 
    document.body.classList.add('printing-cards');
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function updateNextID() {
    if(document.getElementById('e_id').value !== "-1") return; 
    const studentNums = DATA.map(d => parseInt(d.no)).filter(n => !isNaN(n));
    document.getElementById('e_n').value = studentNums.length > 0 ? Math.max(...studentNums) + 1 : 1;
}

function handleTermSelectManualChange() {
    const id = document.getElementById('e_id').value;
    if (id === "-1") {
        const currentName = document.getElementById('e_m').value.trim();
        if(currentName) {
            const existing = DATA.find(s => s.name.toLowerCase() === currentName.toLowerCase());
            if(existing) {
                document.getElementById('e_n').value = existing.no;
                return;
            }
        }
        updateNextID();
    }
}

function getRank(avg, allAvgs) {
    if(!avg || allAvgs.length === 0) return "-";
    const sorted = [...allAvgs].sort((a,b) => b-a);
    const rank = sorted.indexOf(avg) + 1;
    return rank + "/" + allAvgs.length;
}

async function saveData() {
    const id = document.getElementById('e_id').value;
    let no = document.getElementById('e_n').value.trim();
    const name = document.getElementById('e_m').value.trim();
    const sex = document.getElementById('e_x').value;
    const age = document.getElementById('e_a').value.trim();
    const term = parseInt(document.getElementById('e_t').value);
    const conduct = document.getElementById('e_c').value;
    const absent = parseInt(document.getElementById('e_abs').value) || 0;
    const note = document.getElementById('e_com').value.trim();
    const mode = document.getElementById('h_m').value;

    if(!name) { alert("እባክዎ መጀመሪያ የተማሪ ስም ያስገቡ!"); return; }

    let studentIdx = DATA.findIndex(s => s.id === id || (id === "-1" && s.name.toLowerCase() === name.toLowerCase()));
    if(studentIdx > -1) {
        no = DATA[studentIdx].no; 
    } else {
        const studentNums = DATA.map(d => parseInt(d.no)).filter(n => !isNaN(n));
        no = studentNums.length > 0 ? (Math.max(...studentNums) + 1).toString() : "1";
    }
    document.getElementById('e_n').value = no;

    let marks = {};
    let total = 0;
    let subCount = 0;
    SUBJECTS.forEach((sub, i) => {
        const val = parseFloat(document.getElementById(`m_${i}`).value);
        if(!isNaN(val)) {
            marks[sub] = val;
            total += val;
            subCount++;
        } else { marks[sub] = 0; }
    });

    const avg = subCount > 0 ? parseFloat((total / subCount).toFixed(4)) : 0; 
    const finalComment = note || getAutoComment(avg);

    if(studentIdx > -1) {
        if(!DATA[studentIdx].terms) DATA[studentIdx].terms = {};
        DATA[studentIdx].terms[term] = { marks, total, avg, conduct, absent, comment: finalComment };
        DATA[studentIdx].name = name;
        DATA[studentIdx].sex = sex;
        DATA[studentIdx].age = age;
        DATA[studentIdx].no = no;
    } else {
        let newStudent = {
            id: id === "-1" ? "_" + Math.random().toString(36).substr(2, 9) : id,
            no: no, name: name, sex: sex, age: age, terms: {}
        };
        newStudent.terms[term] = { marks, total, avg, conduct, absent, comment: finalComment };
        DATA.push(newStudent);
    }

    await syncWithCloud();

    SUBJECTS.forEach((_, i) => document.getElementById(`m_${i}`).value = "");
    document.getElementById('e_com').value = "";
    
    renderTable();

    const isLastTerm = (mode === 'quarter' && term === 4) || (mode === 'semester' && term === 2);
    if (isLastTerm) {
        clearFormForNewStudent(false); 
    } else {
        const currentTermSelect = document.getElementById('e_t');
        if(currentTermSelect.selectedIndex < currentTermSelect.options.length - 1) {
            currentTermSelect.selectedIndex += 1;
        }
        setTimeout(() => {
            const firstMarkField = document.getElementById('m_0');
            if(firstMarkField) firstMarkField.focus();
        }, 80);
    }
}

    document.getElementById('e_id').value = student.id;
    document.getElementById('e_n').value = student.no;
    document.getElementById('e_m').value = student.name;
    document.getElementById('e_x').value = student.sex;
    document.getElementById('e_a').value = student.age;

window.importJSON = async function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if(Array.isArray(importedData)) {
                DATA = importedData;
                await syncWithCloud();
                renderTable();
                alert("ሮስተር በተሳካ ሁኔታ ወደ ነበረበት ተመልሷል!");
            } else { alert("የተሳሳተ የፋይል ፎርማት!"); }
        } catch (err) { alert("JSON ፋይሉን ማንበብ አልተቻለም!"); }
    };
    reader.readAsText(file);
};

function calcTermGroupAvg(st, targetQuarters) {
    if(!st.terms) return null;
    let sumTotal = 0, sumAvg = 0, count = 0;
    let subSums = {}; SUBJECTS.forEach(s=>subSums[s]=0);
    
    targetQuarters.forEach(q => {
        if(st.terms[q]) {
            sumTotal += st.terms[q].total; sumAvg += st.terms[q].avg; count++;
            SUBJECTS.forEach(s => subSums[s] += (st.terms[q].marks[s] || 0));
        }
    });
    if(count === 0) return null;
    SUBJECTS.forEach(s => subSums[s] = subSums[s]/count);
    return { marks: subSums, total: sumTotal/count, avg: parseFloat((sumAvg/count).toFixed(4)) };
}

function renderRowDataCells(st, label, allQAvgs) {
    let tData = null, rankList = [], conduct = "_", absent = "_", actBtn = "-";
    
    if(label === 'Q1' || label === 'Sem 1') { tData = st.terms ? st.terms[1] : null; rankList = allQAvgs[1]; if(tData){conduct=tData.conduct; absent=tData.absent; actBtn=`<button class="act-btn" onclick="editRec('${st.id}', 1)">✏️</button> <button class="act-btn" onclick="deleteQuarterData('${st.id}', 1)">🗑️</button>`;} }
    else if(label === 'Q2' || label === 'Sem 2') { tData = st.terms ? st.terms[2] : null; rankList = allQAvgs[2]; if(tData){conduct=tData.conduct; absent=tData.absent; actBtn=`<button class="act-btn" onclick="editRec('${st.id}', 2)">✏️</button> <button class="act-btn" onclick="deleteQuarterData('${st.id}', 2)">🗑️</button>`;} }
    else if(label === 'Q3') { tData = st.terms ? st.terms[3] : null; rankList = allQAvgs[3]; if(tData){conduct=tData.conduct; absent=tData.absent; actBtn=`<button class="act-btn" onclick="editRec('${st.id}', 3)">✏️</button> <button class="act-btn" onclick="deleteQuarterData('${st.id}', 3)">🗑️</button>`;} }
    else if(label === 'Q4') { tData = st.terms ? st.terms[4] : null; rankList = allQAvgs[4]; if(tData){conduct=tData.conduct; absent=tData.absent; actBtn=`<button class="act-btn" onclick="editRec('${st.id}', 4)">✏️</button> <button class="act-btn" onclick="deleteQuarterData('${st.id}', 4)">🗑️</button>`;} }
    else if(label === 'SEM 1') { tData = calcTermGroupAvg(st, [1,2]); rankList = allQAvgs.S1; }
    else if(label === 'SEM 2') { tData = calcTermGroupAvg(st, [3,4]); rankList = allQAvgs.S2; }
    else if(label === 'ANNUAL') { tData = calcTermGroupAvg(st, [1,2,3,4]); rankList = allQAvgs.AN; actBtn=`<button class="btn" style="background:#0284c7; padding:2px 6px; font-size:10px;" onclick="showCard('${st.no}')">🗂️ CARD</button> <button class="act-btn" style="color:var(--d); font-weight:bold;" onclick="delEntireStudent('${st.id}')">🗑️ ALL</button>`; }

    if(!tData) return `${SUBJECTS.map(()=>`<td style="border:1.5px solid #000;">-</td>`).join('')}<td style="border:1.5px solid #000;">-</td><td style="border:1.5px solid #000;">-</td><td style="border:1.5px solid #000;">-</td><td style="border:1.5px solid #000;">-</td><td style="border:1.5px solid #000;">-</td><td class="btn-modal-hide" style="border:1.5px solid #000;">-</td>`;

    return `${SUBJECTS.map(s => `<td style="border:1.5px solid #000;">${(tData.marks[s] || 0).toFixed(2)}</td>`).join('')}
        <td style="font-weight:900; border:1.5px solid #000;">${tData.total.toFixed(2)}</td>
        <td style="font-weight:900; border:1.5px solid #000;">${tData.avg.toFixed(2)}</td>
        <td style="background:#fffbeb; font-weight:900; border:1.5px solid #000;">${getRank(tData.avg, rankList)}</td>
        <td style="border:1.5px solid #000;">${conduct}</td><td style="border:1.5px solid #000;">${absent}</td>
        <td class="btn-modal-hide" style="border:1.5px solid #000;">${actBtn}</td>`;
}

function buildCardHTML(no, g, s, classData) {
    const recs = classData.filter(d => d.no == no);
    if(recs.length === 0) return `<div style="padding:10px; color:red; font-weight:bold;">No data found for Student No: ${no}</div>`;
    
    const school = document.getElementById('h_s')?.value || "DILIGENT INTELLECTUALS";
    const year = document.getElementById('h_y')?.value || "";
    const mode = document.getElementById('h_m')?.value || "quarter";
    
    let dynamicSubjects = [...SUBJECTS];

    let tableHtml = `<table class="card-table" style="width:100%; border-collapse:collapse; border: 2.5px solid #000 !important; color: #000; font-size: 10px; font-weight: bold !important;">
        <thead style="background-color: #eee !important; -webkit-print-color-adjust: exact;">
            <tr><th rowspan="2" style="border: 1.5px solid #000 !important; padding: 2px; text-align: center; font-weight: bold !important;">SUBJECTS</th>`;
    
    if(mode === 'quarter') {
        tableHtml += `<th colspan="3" style="border: 1.5px solid #000 !important; font-weight: bold !important;">Semester One</th><th colspan="3" style="border: 1.5px solid #000 !important; font-weight: bold !important;">Semester Two</th><th rowspan="2" style="border: 1.5px solid #000 !important; font-weight: bold !important;">Annual</th></tr>
                      <tr style="font-size: 8.5px; font-weight: bold !important;"><th style="border: 1.5px solid #000 !important;">Q1</th><th style="border: 1.5px solid #000 !important;">Q2</th><th style="border: 1.5px solid #000 !important;">AVG</th><th style="border: 1.5px solid #000 !important;">Q3</th><th style="border: 1.5px solid #000 !important;">Q4</th><th style="border: 1.5px solid #000 !important;">AVG</th></tr></thead><tbody>`;
    } else {
        tableHtml += `<th style="border: 1.5px solid #000 !important; font-weight: bold !important;">Semester One</th><th style="border: 1.5px solid #000 !important; font-weight: bold !important;">Semester Two</th><th style="border: 1.5px solid #000 !important; background:#fefce8 !important; font-weight: bold !important;">Annual</th></tr></thead><tbody>`;
    }

    dynamicSubjects.forEach(sub => {
        const getM = (t) => {
            const studentRec = recs[0];
            if (studentRec && studentRec.terms && studentRec.terms[t] && studentRec.terms[t].marks) {
                const mVal = studentRec.terms[t].marks[sub];
                return (mVal !== undefined && mVal !== "") ? Number(mVal) : "-";
            }
            return "-";
        };

        if(mode === 'quarter') {
            const q = [1, 2, 3, 4].map(t => getM(t));
            const s1 = (typeof q[0]==='number' && typeof q[1]==='number') ? ((q[0]+q[1])/2).toFixed(2) : "-";
            const s2 = (typeof q[2]==='number' && typeof q[3]==='number') ? ((q[2]+q[3])/2).toFixed(2) : "-";
            const vMarks = q.filter(m => typeof m === 'number');
            const ann = vMarks.length > 0 ? (vMarks.reduce((a, b) => a + b, 0) / vMarks.length).toFixed(2) : "-";

            tableHtml += `<tr style="border: 1.5px solid #000 !important; text-align: center; font-weight: bold !important;">
                <td style="text-align:center; padding: 2px; border: 1.5px solid #000 !important; font-size: 10px; white-space: normal; font-weight: bold !important;">${sub}</td>
                <td style="border: 1.5px solid #000 !important; font-weight: bold !important;">${typeof q[0] === 'number' ? q[0].toFixed(2) : q[0]}</td>
                <td style="border: 1.5px solid #000 !important; font-weight: bold !important;">${typeof q[1] === 'number' ? q[1].toFixed(2) : q[1]}</td>
                <td style="background-color: #f3f4f6 !important; border: 1.5px solid #000 !important; font-weight: bold !important;">${s1}</td>
                <td style="border: 1.5px solid #000 !important; font-weight: bold !important;">${typeof q[2] === 'number' ? q[2].toFixed(2) : q[2]}</td>
                <td style="border: 1.5px solid #000 !important; font-weight: bold !important;">${typeof q[3] === 'number' ? q[3].toFixed(2) : q[3]}</td>
                <td style="background-color: #f3f4f6 !important; border: 1.5px solid #000 !important; font-weight: bold !important;">${s2}</td>
                <td style="background-color: #fefce8 !important; border: 2.5px solid #000 !important; font-weight: bold !important;">${ann}</td>
            </tr>`;
        } else {
            const s1 = getM(1), s2 = getM(2);
            const vMarks = [s1, s2].filter(m => typeof m === 'number');
            const ann = vMarks.length > 0 ? (vMarks.reduce((a, b) => a + b, 0) / vMarks.length).toFixed(2) : "-";
            tableHtml += `<tr style="border: 1.5px solid #000 !important; text-align: center; font-weight: bold !important;">

                <td style="background-color: #fefce8 !important; border: 2.5px solid #000 !important; font-weight: bold !important;">${ann}</td>
            </tr>`;
        }
    });

    const metrics = [
        {label: 'TOTAL', key: 'TOTAL'}, {label: 'AVG', key: 'AVG'}, {label: 'RANK', key: 'RANK'}, 
        {label: 'CONDUCT', key: 'COND'}, {label: 'ABSENT', key: 'ABS'}, {label: 'COMMENT', key: 'COMM'}
    ];

    let allQAvgs = {1:[], 2:[], 3:[], 4:[], S1:[], S2:[], AN:[]};

        [1,2,3,4].forEach(q => { if(st.terms && st.terms[q]) allQAvgs[q].push(st.terms[q].avg); });
        let ts1 = calcTermGroupAvg(st, [1,2]), ts2 = calcTermGroupAvg(st, [3,4]), tan = calcTermGroupAvg(st, [1,2,3,4]);
        if(ts1) allQAvgs.S1.push(ts1.avg); if(ts2) allQAvgs.S2.push(ts2.avg); if(tan) allQAvgs.AN.push(tan.avg);
    });

    metrics.forEach(m => {
        tableHtml += `<tr style="border: 1.5px solid #000 !important; text-align: center; font-weight: bold !important;">

        colTerms.forEach(t => {
            let val = "-";
            const isAvgCol = (t === 'S1' || t === 'S2');
            const targetQuarters = isAvgCol ? (t === 'S1' ? [1, 2] : [3, 4]) : [Number(t)];
            const tData = isAvgCol ? calcTermGroupAvg(recs[0], targetQuarters) : (recs[0].terms ? recs[0].terms[Number(t)] : null);
            const rankList = allQAvgs[t];

            if (tData) {
                if (m.key === 'TOTAL') val = tData.total.toFixed(2);
                else if (m.key === 'AVG') val = tData.avg.toFixed(2);
                else if (m.key === 'RANK') val = getRank(tData.avg, rankList);
                else if (m.key === 'COMM') val = getAutoComment(tData.avg);
                else if (m.key === 'COND') val = isAvgCol ? "" : (tData.conduct || "-");
                else if (m.key === 'ABS') val = isAvgCol ? "" : (tData.absent || "0");
            }
            tableHtml += `<td style="font-size:9px; border: 1.5px solid #000 !important; font-weight: bold !important;">${val}</td>`;
        });

        const annData = calcTermGroupAvg(recs[0], [1,2,3,4]);
        let annVal = "-";
        if (annData) {
            if (m.key === 'TOTAL') annVal = annData.total.toFixed(2);
            else if (m.key === 'AVG') annVal = annData.avg.toFixed(2);
            else if (m.key === 'RANK') annVal = getRank(annData.avg, allQAvgs.AN);
            else if (m.key === 'ABS') annVal = ""; 
            else if (m.key === 'COND') annVal = ""; 
            else if (m.key === 'COMM') annVal = getAutoComment(annData.avg);
        }
        tableHtml += `<td style="background:#fefce8 !important; border: 2.5px solid #000 !important; text-align:center; font-size: 8px; font-weight: bold !important;">${annVal}</td></tr>`;
    });

    tableHtml += `</tbody></table>`;

    return `<div class="card-content" style="height: 138mm !important; box-sizing: border-box; padding: 3mm; page-break-inside: avoid; font-weight: bold !important;">
        <div style="border: 3.5px solid #1e3a8a; height: 100%; display: flex; flex-direction: column; background: #fff; font-weight: bold !important;">
            <div style="background-color: #eff6ff !important; padding: 6px; text-align: center; border-bottom: 2.5px solid #1e3a8a; -webkit-print-color-adjust: exact; font-weight: bold !important;">
                <h2 style="margin: 0; color: #1e3a8a; font-size: 1.5em; font-weight: 900 !important; letter-spacing: 0.5px;">${school}</h2>
                <div style="font-weight: 900 !important; color: #1e3a8a; font-size: 13px; margin-top: 3px; letter-spacing: 0.3px;">STUDENT PROGRESS REPORT CARD (${year})</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; padding: 6px; font-weight: bold !important; border-bottom: 2.5px solid #1e3a8a; font-size: 11px; color: #000;">
                <div>Name: <span style="text-decoration: underline; font-weight: bold !important;">${recs[0].name}</span></div>
                <div>No: <span style="text-decoration: underline; font-weight: bold !important;">${no}</span></div>
                <div>Grade: <span style="text-decoration: underline; font-weight: bold !important;">${g} - ${s}</span></div>
                <div>Sex: <span style="text-decoration: underline; font-weight: bold !important;">${recs[0].sex}</span></div>
            </div>
            <div style="padding: 4px; flex-grow: 1; font-weight: bold !important;">${tableHtml}</div>
            <div style="padding: 8px; display: flex; justify-content: space-between; font-weight: bold !important; font-size: 10px; margin-top: auto; color: #000;">
                <div style="text-align: center; width: 45%; border-top: 2px solid #000; padding-top: 2px; font-weight: bold !important;">Teacher's Signature</div>
                <div style="text-align: center; width: 45%; border-top: 2px solid #000; padding-top: 2px; font-weight: bold !important;">Director's Signature</div>
            </div>
        </div>
    </div>`;
}
</script>
</body>
</html>
